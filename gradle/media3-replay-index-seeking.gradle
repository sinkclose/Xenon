// Apply before Media3 projects are configured, on both developer and CI builds.
def mediaDirectory = new File(settingsDir, 'TMessagesProj_Modules/media')
def replayPatch = new File(settingsDir, 'gradle/media3-replay-index-seeking.patch')
def applyPatch = { List<String> options ->
    def invocation = providers.exec {
        commandLine(['git', '-C', mediaDirectory.absolutePath, 'apply'] + options + [replayPatch.absolutePath])
        ignoreExitValue = true
    }
    def code = invocation.result.get().exitValue
    return [code: code, error: invocation.standardError.asText.get()]
}

// Already patched (including repeated configuration) is a successful no-op.
if (applyPatch(['--reverse', '--check']).code != 0) {
    def check = applyPatch(['--check'])
    if (check.code != 0) {
        throw new GradleException('Cannot apply the Media3 replay seek patch. ' + check.error)
    }
    def applied = applyPatch([])
    if (applied.code != 0) {
        throw new GradleException('Cannot apply the Media3 replay seek patch. ' + applied.error)
    }
}
