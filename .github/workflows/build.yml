name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Xray core AAR
        run: |
          set -euo pipefail
          LIB_PATH="TMessagesProj/libs/libv2ray.aar"
          rm -f "$LIB_PATH"

          URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          echo "Downloading libv2ray.aar from: $URL"

          mkdir -p TMessagesProj/libs
          curl -L --fail --retry 3 --retry-delay 3 "$URL" -o "$LIB_PATH"

          if [ ! -s "$LIB_PATH" ]; then
            echo "Downloaded libv2ray.aar is empty"
            exit 1
          fi

          if ! unzip -tq "$LIB_PATH" >/dev/null 2>&1; then
            echo "Downloaded file is not a valid AAR. Check the upstream URL or manually place libv2ray.aar into TMessagesProj/libs/"
            exit 1
          fi

          echo "libv2ray.aar is ready"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        if: github.event_name != 'pull_request'
        run: |
          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks

      - name: Configure Secrets
        if: github.event_name != 'pull_request'
        run: |
          echo "apiId=${{ secrets.API_ID }}" >> local.properties
          echo "apiHash=${{ secrets.API_HASH }}" >> local.properties
          echo "helperBotId=${{ secrets.HELPER_BOT_ID }}" >> local.properties
          echo "helperBotUsername=${{ secrets.HELPER_BOT_USERNAME }}" >> local.properties

      - name: Configure Build
        run: |
          echo "twpicBotUsername=${{ secrets.TWPIC_BOT_USERNAME }}" >> local.properties

          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > TMessagesProj_App/google-services.json

      - name: Build with Gradle (Debug)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :TMessagesProj_App:assembleDebug \
            -PgitCommitHash=$(git rev-parse HEAD) \
            -PgitCommitShort=$(git rev-parse --short=7 HEAD)

      - name: Build with Gradle
        if: github.event_name != 'pull_request'
        run: |
          GIT_HASH=$(git rev-parse HEAD)
          GIT_SHORT=$(git rev-parse --short=7 HEAD)
          echo "Embedding commit: $GIT_SHORT ($GIT_HASH)"
          ./gradlew :TMessagesProj_App:assembleRelease \
            -PgitCommitHash=$GIT_HASH \
            -PgitCommitShort=$GIT_SHORT
          ./gradlew :TMessagesProj_App:bundleRelease \
            -PgitCommitHash=$GIT_HASH \
            -PgitCommitShort=$GIT_SHORT

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/TMessagesProj_App/build/outputs'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          APK_GLOB="outputs/apk/release/*.apk"
          APK_COUNT=$(ls $APK_GLOB 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No release APK found under outputs/apk/release"
            exit 1
          fi

          # Build a markdown table of every APK with size + SHA256.
          TABLE=$(printf '| File | Size | SHA256 |\n|-----------|------|--------|\n')
          while IFS= read -r apk; do
            name=$(basename "$apk")
            size=$(stat -c%s "$apk" | numfmt --to=iec)
            sha=$(sha256sum "$apk" | awk '{print $1}')
            TABLE=$(printf '%s| `%s` | %s | `%s` |\n' "$TABLE" "$name" "$size" "$sha")
          done < <(find outputs/apk/release -name "*.apk" -type f | sort)

          # Preserve newlines across $GITHUB_OUTPUT.
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "table<<$EOF" >> $GITHUB_OUTPUT
          echo "$TABLE" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          echo "count=$APK_COUNT" >> $GITHUB_OUTPUT

      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          COMMIT_FULL=$(git rev-parse HEAD)
          
          # Sanitize commit message for release title
          SANITIZED=$(echo "$COMMIT_MSG" | sed 's/["<>]//g' | cut -c1-100)
          
          echo "title=$SANITIZED" >> $GITHUB_OUTPUT
          echo "hash_short=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "hash_full=$COMMIT_FULL" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.commit_info.outputs.title }}"
          tag_name: "${{ steps.commit_info.outputs.hash_short }}"
          body: |
            ## Build Info
            - **Commit:** `${{ steps.commit_info.outputs.hash_full }}`
            - **Short Hash:** `${{ steps.commit_info.outputs.hash_short }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Date:** ${{ github.event.head_commit.timestamp }}

            ## APKs (${{ steps.apks.outputs.count }})
            ${{ steps.apks.outputs.table }}
          files: |
            outputs/apk/release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  telegram:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - name: Build message and publish to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set"
            exit 1
          fi

          API="https://api.telegram.org/bot${TG_TOKEN}"

          # Commit / build metadata.
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          HASH_SHORT=$(git rev-parse --short=7 HEAD)
          HASH_FULL=$(git rev-parse HEAD)
          BRANCH="${GITHUB_REF_NAME:-main}"
          BUILD_DATE="${BUILD_DATE:-$(date -u '+%Y-%m-%d %H:%M:%S UTC')}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # GitHub Release created by the `release` job above (tag = short hash).
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${HASH_SHORT}"

          # HTML-escape <, >, & for Telegram parse_mode=HTML.
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          COMMIT_MSG_ESC=$(printf '%s' "$COMMIT_MSG" | esc)

          # Compose the descriptive message (use real newlines — curl encodes them).
          NL=$'\n'
          MSG="🛠 <b>Новый билд</b>${NL}${NL}"
          MSG+="📅 <b>Дата сборки:</b> ${BUILD_DATE}${NL}"
          MSG+="🌿 <b>Ветка:</b> ${BRANCH}${NL}"
          MSG+="🔗 <b>Коммит:</b> <code>${HASH_SHORT}</code> — ${COMMIT_MSG_ESC}${NL}"
          MSG+="📦 <b>Релиз:</b> <a href=\"${RELEASE_URL}\">GitHub Release</a>${NL}"
          MSG+="⚙️ <b>CI:</b> <a href=\"${RUN_URL}\">GitHub Actions run</a>${NL}${NL}"
          MSG+="<b>APK-файлы:</b>${NL}"

          # Collect every release APK with size + SHA256.
          # Telegram Bot API file limit: 50 MB. APKs above the limit will
          # be included in the message as GitHub Release links instead.
          TG_MAX_BYTES=$((50 * 1024 * 1024))
          shopt -s nullglob
          apks=(outputs/apk/release/*.apk)
          shopt -u nullglob
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APK found under outputs/apk/release"
            exit 1
          fi

          # Sort for a stable order.
          IFS=$'\n' sorted=($(sort <<<"${apks[*]}")); unset IFS

          # Separate into sendable (>50 MB → link only) and append
          # large-APK download links to the initial message.
          for apk in "${sorted[@]}"; do
            name=$(basename "$apk")
            size_bytes=$(stat -c%s "$apk")
            sha=$(sha256sum "$apk" | awk '{print $1}')
            name_esc=$(printf '%s' "$name" | esc)

            if [ "$size_bytes" -le "$TG_MAX_BYTES" ]; then
              MSG+="📎 <b>${name_esc}</b> — отправлю файлом${NL}"
            else
              size_human=$(echo "$size_bytes" | numfmt --to=iec)
              MSG+="📎 <b>${name_esc}</b> — ${size_human} (слишком большой для бота)${NL}"
              MSG+="   📥 <a href=\"${RELEASE_URL}\">Скачать с GitHub Release</a>${NL}"
              MSG+="   🔑 <code>${sha}</code>${NL}"
            fi
          done

          curl --fail --silent --show-error \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            "${API}/sendMessage" >/dev/null

          # Send each APK that fits within the Bot API limit as a document.
          for apk in "${sorted[@]}"; do
            size_bytes=$(stat -c%s "$apk")
            if [ "$size_bytes" -gt "$TG_MAX_BYTES" ]; then
              echo "Skipping $(basename "$apk") — too large ($(echo "$size_bytes" | numfmt --to=iec))"
              continue
            fi

            name=$(basename "$apk")
            size=$(echo "$size_bytes" | numfmt --to=iec)
            sha=$(sha256sum "$apk" | awk '{print $1}')
            name_esc=$(printf '%s' "$name" | esc)

            caption="<b>${name_esc}</b>${NL}"
            caption+="📦 ${size}${NL}"
            caption+="🔑 <code>${sha}</code>"

            echo "Sending ${name} (${size})..."
            curl --fail --silent --show-error \
              --form "chat_id=${TG_CHAT_ID}" \
              --form "document=@${apk}" \
              --form "caption=${caption}" \
              --form "parse_mode=HTML" \
              "${API}/sendDocument" >/dev/null
          done

          echo "All APKs published to Telegram."
