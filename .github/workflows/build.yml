name: Build

# Отменяем устаревшие прогоны на той же ветке, чтобы пуши подряд
# не копились в очереди и не выглядели как "зависший" workflow.
concurrency:
  group: build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "dev", "ci", "ayu-features" ]
    # NOTE: '!' negation is only supported in `paths`, NOT in `paths-ignore`
    # (silently dropped there) — that's why a workflow-only push used to skip
    # the build. Include everything, drop docs and .github, then re-include
    # this file so workflow changes are still validated by CI.
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Ensure Xray core AAR
        run: |
          set -euo pipefail
          LIB_PATH="TMessagesProj/libs/libv2ray.aar"
          rm -f "$LIB_PATH"

          URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          echo "Downloading libv2ray.aar from: $URL"

          mkdir -p TMessagesProj/libs
          curl -L --fail --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 900 "$URL" -o "$LIB_PATH"

          if [ ! -s "$LIB_PATH" ]; then
            echo "Downloaded libv2ray.aar is empty"
            exit 1
          fi

          if ! unzip -tq "$LIB_PATH" >/dev/null 2>&1; then
            echo "Downloaded file is not a valid AAR. Check the upstream URL or manually place libv2ray.aar into TMessagesProj/libs/"
            exit 1
          fi

          echo "libv2ray.aar is ready"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
        run: |
          set -euo pipefail
          printf 'storeFile=%s/keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> local.properties
          printf '%s' "$KEYSTORE_JKS" | base64 --decode > keystore.jks

      - name: Configure Secrets
        if: github.event_name != 'pull_request'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          HELPER_BOT_ID: ${{ secrets.HELPER_BOT_ID }}
          HELPER_BOT_USERNAME: ${{ secrets.HELPER_BOT_USERNAME }}
        run: |
          printf 'apiId=%s\napiHash=%s\nhelperBotId=%s\nhelperBotUsername=%s\n' \
            "$API_ID" "$API_HASH" "$HELPER_BOT_ID" "$HELPER_BOT_USERNAME" >> local.properties

      - name: Configure Build
        env:
          TWPIC_BOT_USERNAME: ${{ secrets.TWPIC_BOT_USERNAME }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf 'twpicBotUsername=%s\n' "$TWPIC_BOT_USERNAME" >> local.properties

          # The google-services plugin is applied to :TMessagesProj_App, so the file
          # must live in that module and contain a client entry for APP_PACKAGE,
          # otherwise the build fails or FCM silently never delivers pushes.
          APP_PACKAGE=$(grep -E '^APP_PACKAGE=' gradle.properties | cut -d= -f2)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is not available for pull requests, using a placeholder (FCM will not work in this build)."
            python3 -c 'import json; json.dump({"project_info": {"project_number": "100000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:100000000000:android:00000000000000001000000000000000", "android_client_info": {"package_name": "zxc.iconic.xenon"}}, "api_key": [{"current_key": "placeholder"}]}], "configuration_version": "1"}, open("TMessagesProj_App/google-services.json", "w"))'
          else
            echo "::error::GOOGLE_SERVICES_JSON secret is not set, cannot build an FCM-enabled APK."
            exit 1
          fi
          python3 -c 'import json,sys
          data=json.load(open("TMessagesProj_App/google-services.json",encoding="utf-8"))
          pkgs=[c.get("client_info",{}).get("android_client_info",{}).get("package_name") for c in data.get("client",[])]
          print(f"google-services.json packages: {pkgs}")
          if sys.argv[1] not in pkgs:
              sys.exit(f"::error::google-services.json has no client entry for {sys.argv[1]!r}; FCM pushes would silently break.")' "$APP_PACKAGE"

      - name: Build with Gradle (Debug)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :TMessagesProj_App:assembleDebug \
            -PgitCommitHash=$(git rev-parse HEAD) \
            -PgitCommitShort=$(git rev-parse --short=7 HEAD) \
            -PgitCommitDate=$(git log -1 --format=%cI)

      - name: Build with Gradle
        if: github.event_name != 'pull_request'
        run: |
          GIT_HASH=$(git rev-parse HEAD)
          GIT_SHORT=$(git rev-parse --short=7 HEAD)
          GIT_DATE=$(git log -1 --format=%cI)
          CHANNEL=""
          if [ "${{ github.ref }}" = "refs/heads/ayu-features" ]; then
            CHANNEL="posral"
          fi
          echo "Embedding commit: $GIT_SHORT ($GIT_HASH) channel: $CHANNEL"
          ./gradlew :TMessagesProj_App:assembleRelease \
            -PgitCommitHash=$GIT_HASH \
            -PgitCommitShort=$GIT_SHORT \
            -PgitCommitDate=$GIT_DATE \
            -PbuildChannel=$CHANNEL
          ./gradlew :TMessagesProj_App:bundleRelease \
            -PgitCommitHash=$GIT_HASH \
            -PgitCommitShort=$GIT_SHORT \
            -PgitCommitDate=$GIT_DATE \
            -PbuildChannel=$CHANNEL

      # Attest every APK + AAB produced by both gradle tasks above. Must run
      # AFTER bundleRelease, otherwise .aab artifacts are never attested.
      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/TMessagesProj_App/build/outputs/**/*.apk
            ${{ github.workspace }}/TMessagesProj_App/build/outputs/**/*.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ayu-features')
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.publish.outputs.assets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(outputs/apk/release/*.apk)
          APK_COUNT=${#apks[@]}
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No release APK found under outputs/apk/release"
            exit 1
          fi

          # Build a markdown table of every APK with size + SHA256.
          {
            echo 'table<<APK_TABLE'
            printf '| File | Size | SHA256 |\n|------|------|--------|\n'
            for apk in "${apks[@]}"; do
              name=$(basename "$apk")
              size=$(stat -c%s "$apk" | numfmt --to=iec)
              sha=$(sha256sum "$apk" | awk '{print $1}')
              printf '| `%s` | %s | `%s` |\n' "$name" "$size" "$sha"
            done
            echo 'APK_TABLE'
            echo "count=$APK_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          COMMIT_FULL=$(git rev-parse HEAD)
          
          # Sanitize commit message for release title
          SANITIZED=$(echo "$COMMIT_MSG" | sed 's/["<>]//g' | cut -c1-100)
          
          echo "title=$SANITIZED" >> $GITHUB_OUTPUT
          echo "hash_short=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "hash_full=$COMMIT_FULL" >> $GITHUB_OUTPUT

      # ayu-features publishes to its own posral- prerelease stream so it never
      # shadows the main /releases/latest. main keeps the original bare-hash tag.
      - name: Release channel parameters
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/ayu-features" ]; then
            echo "tag_prefix=posral-" >> $GITHUB_OUTPUT
            echo "name_prefix=[posral] " >> $GITHUB_OUTPUT
            echo "is_posral=true" >> $GITHUB_OUTPUT
          else
            echo "tag_prefix=" >> $GITHUB_OUTPUT
            echo "name_prefix=" >> $GITHUB_OUTPUT
            echo "is_posral=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.channel.outputs.name_prefix }}${{ steps.commit_info.outputs.title }}"
          tag_name: "${{ steps.channel.outputs.tag_prefix }}${{ steps.commit_info.outputs.hash_short }}"
          prerelease: ${{ steps.channel.outputs.is_posral }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Build Info
            - **Commit:** `${{ steps.commit_info.outputs.hash_full }}`
            - **Short Hash:** `${{ steps.commit_info.outputs.hash_short }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Date:** ${{ github.event.head_commit.timestamp }}

            ## APKs (${{ steps.apks.outputs.count }})
            ${{ steps.apks.outputs.table }}
          files: |
            outputs/apk/release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  telegram:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Publish APK links to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_ASSETS: ${{ needs.release.outputs.assets }}
        run: python3 .github/scripts/telegram_release.py
