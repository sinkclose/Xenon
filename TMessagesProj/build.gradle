// Resolve git commit hashes at the top level, OUTSIDE android {} block.
// Priority: Gradle property (-PgitCommitHash=...) > local git > "unknown"
def resolvedGitHash = project.findProperty('gitCommitHash') ?: {
    try {
        def process = ['git', 'rev-parse', 'HEAD'].execute(null, rootProject.rootDir)
        def result = process.text.trim()
        process.waitFor()
        return result.isEmpty() ? "unknown" : result
    } catch (ignored) {
        return "unknown"
    }
}()

def resolvedGitShort = project.findProperty('gitCommitShort') ?: {
    try {
        def process = ['git', 'rev-parse', '--short=7', 'HEAD'].execute(null, rootProject.rootDir)
        def result = process.text.trim()
        process.waitFor()
        return result.isEmpty() ? "unknown" : result
    } catch (ignored) {
        return "unknown"
    }
}()

def resolvedGitCommitDate = project.findProperty('gitCommitDate') ?: {
    try {
        def process = ['git', 'log', '-1', '--format=%cI'].execute(null, rootProject.rootDir)
        def result = process.text.trim()
        process.waitFor()
        return result.isEmpty() ? "unknown" : result
    } catch (ignored) {
        return "unknown"
    }
}()

logger.lifecycle("Git commit hash: ${resolvedGitHash}")
logger.lifecycle("Git commit short: ${resolvedGitShort}")
logger.lifecycle("Git commit date: ${resolvedGitCommitDate}")

