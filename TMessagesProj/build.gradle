def libv2rayFile = file("$projectDir/libs/libv2ray.aar")
def libv2rayUrl = "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"

def isValidAar = { File target ->
    if (!target.exists() || target.length() <= 0) {
        return false
    }
    try {
        ZipFile zip = new ZipFile(target)
        zip.close()
        return true
    } catch (Throwable ignore) {
        return false
    }
}

def ensureLibv2rayAar = {
    if (isValidAar(libv2rayFile)) {
        return
    } else if (libv2rayFile.exists()) {
        logger.lifecycle("Existing libv2ray.aar is invalid, re-downloading.")
        libv2rayFile.delete()
    }

    if (gradle.startParameter.isOffline()) {
        throw new GradleException("libv2ray.aar is missing and Gradle is in offline mode")
    }

    libv2rayFile.parentFile.mkdirs()
    logger.lifecycle("Downloading libv2ray.aar from ${libv2rayUrl}")

    HttpURLConnection connection = (HttpURLConnection) new URL(libv2rayUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    connection.setConnectTimeout(15000)
    connection.setReadTimeout(120000)
    connection.setRequestProperty("User-Agent", "Gradle/${gradle.gradleVersion}")
    connection.connect()

    int responseCode = connection.getResponseCode()
    if (responseCode < 200 || responseCode >= 400) {
        throw new GradleException("Failed to download libv2ray.aar (HTTP ${responseCode})")
    }

    libv2rayFile.withOutputStream { output ->
        connection.inputStream.withStream { input ->
            output << input
        }
    }

    if (!libv2rayFile.exists() || libv2rayFile.length() == 0) {
        throw new GradleException("Downloaded libv2ray.aar is empty")
    }

    if (!isValidAar(libv2rayFile)) {
        libv2rayFile.delete()
        throw new GradleException("Downloaded libv2ray.aar is invalid")
    }
}

ensureLibv2rayAar()

